# Flutter app: static analysis and unit tests, with the Flutter version from app/.flutter-version.
# The engine bundle is a pubspec asset that git does not track, so it is built first.
name: App

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < app/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.flutter-version.outputs.version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/engine/package-lock.json
      - name: Build the engine bundle into the app assets
        working-directory: app
        run: sh tool/copy_engine_bundle.sh
      - name: Resolve packages from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

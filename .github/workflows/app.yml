# Flutter app: static analysis and unit tests, with the Flutter version from app/.flutter-version.
name: App

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: app/.flutter-version
      - name: Resolve packages from the lockfile
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

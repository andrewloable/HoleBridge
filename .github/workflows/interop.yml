# Interop: pears-go against the JS HyperDHT and the other JS reference libraries in interop/js, on three systems.
# npm ci installs the JS peers first. CI is set on runners, so a missing node or package fails the interop tests
# instead of letting them skip (interop/skip_test.go).
name: Interop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  interop:
    name: Interop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: interop/js/package-lock.json
      - name: Install the JS peers
        working-directory: interop/js
        run: npm ci
      # The UDX throughput table runs here too, so the limit leaves room on slower runners.
      - name: Interop tests
        shell: bash
        run: go test -count=1 -timeout 45m ./interop/...

# App engine (app/engine): exact pins, the Bare test suite and the bundle that the app loads.
name: Engine

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: app/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/engine/package-lock.json
      - run: npm ci
      - run: npm run check-pins
      - run: npm test
      - run: npm run bundle

# Shared test vectors: the generators must reproduce spec/vectors exactly, and their pins must match
# the app engine's.
name: Spec

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  vectors:
    name: Vectors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            spec/gen/package-lock.json
            app/engine/package-lock.json
      - name: Install generator dependencies
        working-directory: spec/gen
        run: npm ci
      - name: Check pins against the app engine
        working-directory: spec/gen
        run: node check-versions.js
      - name: Run every generator
        working-directory: spec/gen
        run: |
          for gen in *.js; do
            if [ "$gen" = check-versions.js ]; then continue; fi
            node "$gen"
          done
      - name: Vectors match the generators
        run: |
          git diff --exit-code -- spec/vectors
          if [ -n "$(git ls-files --others --exclude-standard -- spec/vectors)" ]; then
            echo "The generators wrote files that are not committed." >&2
            exit 1
          fi

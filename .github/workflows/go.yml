# Go host, relay and pears-go: vet and tests on three systems, then the repo guards on Linux.
# Pure Go, so every step runs with cgo off.
name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # pears/udx alone takes about 4 minutes; the 10 minute limit leaves room on slower runners.
      # The interop tests need npm ci in interop/js and run in interop.yml, so this step leaves them out.
      - name: Test
        shell: bash
        run: go list ./... | grep -v '/interop$' | xargs go test -timeout 10m
      - name: Repo guards
        if: runner.os == 'Linux'
        run: |
          scripts/check-go-deps.sh
          scripts/check-no-secrets.sh
          go run ./internal/errs/check

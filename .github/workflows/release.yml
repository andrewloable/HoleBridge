# Release: when a person publishes a release on GitHub for a v<version> tag, this workflow builds the six archives and
# SHA256SUMS (scripts/release-build.sh) and uploads them to that release. If CHANGELOG.md has a section for the version,
# the section becomes the release notes (scripts/extract-changelog.sh); otherwise the notes written on GitHub stay.
# The publisher must be a person (or gh with their own token): a release created with the workflow token starts no
# workflows. The build job only reads the repository; the release job is the only one with contents: write, and it
# runs no code from the repository.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build the archives and notes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag name is read through the environment, never spliced into the script, and checked before any use.
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release: tag '$TAG' is not v<major>.<minor>.<patch>, with an optional -suffix" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      # The release already exists with the notes its publisher wrote, so a missing section is not a failure: no
      # release-notes.md is made, and the release job keeps the notes on GitHub.
      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if scripts/extract-changelog.sh "$VERSION" > release-notes.md; then
            echo "Release notes: the CHANGELOG.md section for $VERSION."
          else
            rm -f release-notes.md
            echo "Release notes: no CHANGELOG.md section for $VERSION; the release keeps the notes written on GitHub."
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/engine/package-lock.json
      # release-build.sh runs npm ci in app/engine itself.
      - name: Build the archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/release-build.sh "$VERSION"
      - name: Upload the archives and notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            release-notes.md
          if-no-files-found: error

  release:
    name: Upload the archives and notes to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      # No checkout here, so the job runs nothing from the repository. The artifact holds dist/ and, when there is a
      # changelog section, release-notes.md.
      - name: Download the archives and notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Upload the archives to the release
        run: gh release upload "$TAG" dist/* --clobber
      - name: Set the notes from CHANGELOG.md
        run: |
          if [ -f release-notes.md ]; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "No CHANGELOG.md section for this version; the release keeps the notes written on GitHub."
          fi
